services:
  database:
    image: postgres:16
    container_name: secure-database
    entrypoint: ["/usr/local/bin/db-start.sh"]
    volumes:
      - ./backend/db-start.sh:/usr/local/bin/db-start.sh:ro
      - ./runtime-secrets/database.env:/run/secrets/database.env:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d secureapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: secure-backend
    container_name: secure-backend-compose
    volumes:
      - ./runtime-secrets/database.env:/run/secrets/database.env:ro
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: secure-frontend
    container_name: secure-frontend-compose
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
