name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security Checks
    runs-on: self-hosted

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # Create reports directory
      # ==========================================
      - name: Create security reports directory
        run: |
          rm -rf security-reports
          mkdir -p security-reports

      # ==========================================
      # 1. TruffleHog - Secret Scan
      # ==========================================
      - name: TruffleHog Secret Scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            trufflesecurity/trufflehog:latest \
            git file:///repo \
            --results=verified,unknown \
            > security-reports/trufflehog.txt 2>&1

      # ==========================================
      # 2. Bandit - Python Security Scan
      # ==========================================
      - name: Create Python Security Environment
        run: |
          rm -rf /tmp/security-venv
          python3 -m venv /tmp/security-venv
          /tmp/security-venv/bin/python -m pip install --upgrade pip
          /tmp/security-venv/bin/pip install bandit

      - name: Bandit Python Security Scan
        continue-on-error: true
        run: |
          /tmp/security-venv/bin/bandit \
            -r ./backend \
            -ll \
            -f txt \
            > security-reports/bandit.txt 2>&1

      # ==========================================
      # 3. Hadolint - Dockerfile Scan
      # ==========================================
      - name: Hadolint Backend Dockerfile Scan
        continue-on-error: true
        run: |
          docker run --rm -i \
            hadolint/hadolint:latest \
            < ./backend/Dockerfile \
            > security-reports/hadolint-backend.txt 2>&1

      - name: Hadolint Frontend Dockerfile Scan
        continue-on-error: true
        run: |
          docker run --rm -i \
            hadolint/hadolint:latest \
            < ./frontend/Dockerfile \
            > security-reports/hadolint-frontend.txt 2>&1

      # ==========================================
      # 4. Docker Build for Trivy
      # ==========================================
      - name: Build Backend Image for Trivy
        continue-on-error: true
        run: |
          docker build \
            -t secure-backend:security-scan \
            ./backend \
            > security-reports/backend-build.txt 2>&1

      - name: Build Frontend Image for Trivy
        continue-on-error: true
        run: |
          docker build \
            -t secure-frontend:security-scan \
            ./frontend \
            > security-reports/frontend-build.txt 2>&1

      # ==========================================
      # 5. Trivy - Container Security Scan
      # ==========================================
      - name: Trivy Backend Image Scan
        continue-on-error: true
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            secure-backend:security-scan \
            > security-reports/trivy-backend.txt 2>&1

      - name: Trivy Frontend Image Scan
        continue-on-error: true
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            secure-frontend:security-scan \
            > security-reports/trivy-frontend.txt 2>&1

      # ==========================================
      # Upload Security Reports
      # ==========================================
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
