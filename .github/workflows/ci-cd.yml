name: Secure Full-Stack CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/secure-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/secure-frontend

jobs:

  # ============================================================
  # 1. SECURITY
  # ============================================================
  security:
    name: Security Scans
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Security Virtual Environment
        run: |
          rm -rf /tmp/security-venv
          python3 -m venv /tmp/security-venv
          /tmp/security-venv/bin/python -m pip install --upgrade pip

      - name: Install Security Tools
        run: |
          /tmp/security-venv/bin/pip install bandit pip-audit

      - name: Bandit Python Security Scan
        run: |
          /tmp/security-venv/bin/bandit -r ./backend -ll

      - name: pip-audit Dependency Scan
        working-directory: ./backend
        run: |
          /tmp/security-venv/bin/pip-audit -r requirements.txt


  # ============================================================
  # 2. BUILD + TRIVY
  # ============================================================
  build:
    name: Build and Scan Docker Images
    needs: security
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:latest" \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t "${FRONTEND_IMAGE}:latest" \
            ./frontend

      - name: Trivy Backend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy Frontend Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Verify Docker Images
        run: |
          docker image inspect "${BACKEND_IMAGE}:latest"
          docker image inspect "${FRONTEND_IMAGE}:latest"


  # ============================================================
  # 3. PUBLISH TO GHCR
  # ============================================================
  publish:
    name: Publish Images to GHCR
    needs: build
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$CR_PAT" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Backend Image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:latest" \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t "${FRONTEND_IMAGE}:latest" \
            ./frontend

      - name: Push Backend Image
        run: |
          docker push "${BACKEND_IMAGE}:latest"

      - name: Push Frontend Image
        run: |
          docker push "${FRONTEND_IMAGE}:latest"

      - name: Logout from GHCR
        if: always()
        run: |
          docker logout ghcr.io


  # ============================================================
  # 4. DEPLOY
  # ============================================================
  deploy:
    name: Deploy Application
    needs: publish
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Login to GHCR
      # ----------------------------------------------------------
      - name: Login to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$CR_PAT" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # ----------------------------------------------------------
      # Pull latest images
      # ----------------------------------------------------------
      - name: Pull Backend Image
        run: |
          docker pull "${BACKEND_IMAGE}:latest"

      - name: Pull Frontend Image
        run: |
          docker pull "${FRONTEND_IMAGE}:latest"

      # ----------------------------------------------------------
      # Tag images for docker-compose
      # ----------------------------------------------------------
      - name: Tag Backend Image
        run: |
          docker tag \
            "${BACKEND_IMAGE}:latest" \
            secure-backend:latest

      - name: Tag Frontend Image
        run: |
          docker tag \
            "${FRONTEND_IMAGE}:latest" \
            secure-frontend:latest

      # ----------------------------------------------------------
      # Project directory
      # ----------------------------------------------------------
      - name: Verify Deployment Directory
        run: |
          if [ ! -d "/home/alaa/secure-fullstack-project" ]; then
            echo "ERROR: Deployment directory does not exist."
            exit 1
          fi

          if [ ! -f "/home/alaa/secure-fullstack-project/docker-compose.yaml" ]; then
            echo "ERROR: docker-compose.yaml not found."
            exit 1
          fi

          echo "Deployment directory verified."

      # ----------------------------------------------------------
      # Verify Vault Agent container
      # ----------------------------------------------------------
      - name: Verify Vault Agent Container
        run: |
          if ! docker ps --format '{{.Names}}' | grep -qx 'secure-vault-agent'; then
            echo "ERROR: secure-vault-agent is not running."
            exit 1
          fi

          echo "Vault Agent container is running."

      # ----------------------------------------------------------
      # Verify Vault Agent process
      # ----------------------------------------------------------
      - name: Verify Vault Agent Process
        run: |
          if ! docker exec secure-vault-agent \
            sh -c "ps aux | grep '[v]ault agent' >/dev/null 2>&1"; then

            echo "ERROR: Vault Agent process is not running."
            exit 1
          fi

          echo "Vault Agent process is running."

      # ----------------------------------------------------------
      # Verify database secret
      # ----------------------------------------------------------
      - name: Verify Database Secret
        run: |
          SECRET_FILE="/home/alaa/secure-fullstack-project/runtime-secrets/database.env"

          if [ ! -s "$SECRET_FILE" ]; then
            echo "ERROR: Vault Agent did not generate database.env."
            exit 1
          fi

          chmod 600 "$SECRET_FILE"

          PERMS="$(stat -c '%a' "$SECRET_FILE")"

          echo "Database secret permissions: $PERMS"

          if [ "$PERMS" != "600" ]; then
            echo "ERROR: database.env must have permissions 600."
            exit 1
          fi

          echo "Database secret is available."

      # ----------------------------------------------------------
      # Deploy from real project directory
      # ----------------------------------------------------------
      - name: Stop Application
        working-directory: /home/alaa/secure-fullstack-project
        run: |
          docker compose down || true

      - name: Start Application
        working-directory: /home/alaa/secure-fullstack-project
        run: |
          docker compose up -d

      # ----------------------------------------------------------
      # Verify containers
      # ----------------------------------------------------------
      - name: Verify Containers
        working-directory: /home/alaa/secure-fullstack-project
        run: |
          docker compose ps

      # ----------------------------------------------------------
      # Verify database
      # ----------------------------------------------------------
      - name: Verify Database
        working-directory: /home/alaa/secure-fullstack-project
        run: |
          for i in $(seq 1 30); do

            if docker exec secure-database \
              pg_isready -U appuser -d secureapp >/dev/null 2>&1; then

              echo "Database health check passed."
              exit 0
            fi

            echo "Waiting for database..."
            sleep 2

          done

          echo "ERROR: Database health check failed."
          docker compose logs database
          exit 1

      # ----------------------------------------------------------
      # Verify backend
      # ----------------------------------------------------------
      - name: Verify Backend
        run: |
          for i in $(seq 1 30); do

            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Backend health check passed."
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2

          done

          echo "ERROR: Backend health check failed."
          docker compose -f /home/alaa/secure-fullstack-project/docker-compose.yaml logs backend
          exit 1

      # ----------------------------------------------------------
      # Verify backend database connection
      # ----------------------------------------------------------
      - name: Verify Backend Database Connection
        run: |
          for i in $(seq 1 15); do

            if curl -fsS http://localhost:8000/db-test; then
              echo
              echo "Backend database connection passed."
              exit 0
            fi

            echo "Waiting for backend database connection..."
            sleep 2

          done

          echo "ERROR: Backend database connection failed."
          docker compose -f /home/alaa/secure-fullstack-project/docker-compose.yaml logs backend
          exit 1

      # ----------------------------------------------------------
      # Verify frontend
      # ----------------------------------------------------------
      - name: Verify Frontend
        run: |
          curl -fsSI http://localhost:8080/

          echo
          echo "Frontend health check passed."

      # ----------------------------------------------------------
      # Logout from GHCR
      # ----------------------------------------------------------
      - name: Logout from GHCR
        if: always()
        run: |
          docker logout ghcr.io
