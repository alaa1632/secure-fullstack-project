name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # Build Backend
  # ==========================================
  build-backend:
    name: Build Backend
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t secure-backend:latest \
            ./backend

  # ==========================================
  # Build Frontend
  # ==========================================
  build-frontend:
    name: Build Frontend
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t secure-frontend:latest \
            ./frontend

  # ==========================================
  # Publish Images to GHCR
  # ==========================================
  publish:
    name: Publish Docker Images
    runs-on: self-hosted
    needs:
      - build-backend
      - build-frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ------------------------------------------
      # Build Backend
      # ------------------------------------------
      - name: Build Backend Image
        run: |
          docker build \
            -t ghcr.io/alaa1632/secure-fullstack-project/backend:latest \
            ./backend

      # ------------------------------------------
      # Build Frontend
      # ------------------------------------------
      - name: Build Frontend Image
        run: |
          docker build \
            -t ghcr.io/alaa1632/secure-fullstack-project/frontend:latest \
            ./frontend

      # ------------------------------------------
      # Login to GitHub Container Registry
      # ------------------------------------------
      - name: Login to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$CR_PAT" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      # ------------------------------------------
      # Push Backend
      # ------------------------------------------
      - name: Push Backend Image
        run: |
          docker push \
            ghcr.io/alaa1632/secure-fullstack-project/backend:latest

      # ------------------------------------------
      # Push Frontend
      # ------------------------------------------
      - name: Push Frontend Image
        run: |
          docker push \
            ghcr.io/alaa1632/secure-fullstack-project/frontend:latest

  # ==========================================
  # Deploy Application
  # ==========================================
  deploy:
    name: Deploy Application
    runs-on: self-hosted
    needs:
      - publish

    steps:

      # ------------------------------------------
      # Go to Persistent Project Directory
      # ------------------------------------------
      - name: Verify project directory
        run: |
          cd /home/alaa/secure-fullstack-project

          echo "Project directory:"
          pwd

          echo "Checking Docker Compose:"
          docker compose version

      # ------------------------------------------
      # Verify Vault Agent Container
      # ------------------------------------------
      - name: Verify Vault Agent
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^secure-vault-agent$'; then
            echo "ERROR: secure-vault-agent is not running."
            exit 1
          fi

          echo "Vault Agent container is running."

      # ------------------------------------------
      # Verify Vault Agent Process
      # ------------------------------------------
      - name: Verify Vault Agent Process
        run: |
          docker exec secure-vault-agent \
            sh -c 'ps aux | grep "[v]ault agent"'

          echo "Vault Agent process verified."

      # ------------------------------------------
      # Verify Runtime Secret File
      # ------------------------------------------
      - name: Verify Runtime Secrets
        run: |
          SECRET_FILE="/home/alaa/secure-fullstack-project/runtime-secrets/database.env"

          if [ ! -f "$SECRET_FILE" ]; then
            echo "ERROR: Runtime secret file does not exist."
            exit 1
          fi

          PERMS=$(stat -c "%a" "$SECRET_FILE")

          echo "Secret file permissions: $PERMS"

          if [ "$PERMS" != "600" ]; then
            echo "ERROR: Secret file permissions must be 600."
            exit 1
          fi

          echo "Runtime secret file verified."

      # ------------------------------------------
      # Deploy Application Stack
      # ------------------------------------------
      - name: Deploy Docker Compose Stack
        run: |
          cd /home/alaa/secure-fullstack-project

          docker compose down

          docker compose up -d --build

      # ------------------------------------------
      # Wait for Containers
      # ------------------------------------------
      - name: Wait for Application
        run: |
          echo "Waiting for containers..."

          sleep 15

          docker ps \
            --filter "name=secure-database" \
            --filter "name=secure-backend-compose" \
            --filter "name=secure-frontend-compose"

      # ------------------------------------------
      # Verify Database
      # ------------------------------------------
      - name: Verify Database
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^secure-database$'; then
            echo "ERROR: Database container is not running."
            exit 1
          fi

          echo "Database container is running."

      # ------------------------------------------
      # Verify Backend
      # ------------------------------------------
      - name: Verify Backend
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^secure-backend-compose$'; then
            echo "ERROR: Backend container is not running."
            exit 1
          fi

          echo "Backend container is running."

      # ------------------------------------------
      # Verify Frontend
      # ------------------------------------------
      - name: Verify Frontend
        run: |
          if ! docker ps --format '{{.Names}}' | grep -q '^secure-frontend-compose$'; then
            echo "ERROR: Frontend container is not running."
            exit 1
          fi

          echo "Frontend container is running."

      # ------------------------------------------
      # Backend Health Check
      # ------------------------------------------
      - name: Backend Health Check
        run: |
          echo "Checking backend..."

          curl --fail \
            --silent \
            --show-error \
            http://localhost:8000/health

          echo
          echo "Backend health check passed."

      # ------------------------------------------
      # Database Connection Test
      # ------------------------------------------
      - name: Database Connection Test
        run: |
          echo "Checking database connection..."

          curl --fail \
            --silent \
            --show-error \
            http://localhost:8000/db-test

          echo
          echo "Database connection test passed."

      # ------------------------------------------
      # Frontend Health Check
      # ------------------------------------------
      - name: Frontend Health Check
        run: |
          echo "Checking frontend..."

          curl --fail \
            --silent \
            --show-error \
            -I http://localhost:8080/

          echo
          echo "Frontend health check passed."

      # ------------------------------------------
      # Deployment Summary
      # ------------------------------------------
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "      DEPLOYMENT SUCCESSFUL"
          echo "=========================================="
          echo
          echo "Frontend: http://localhost:8080"
          echo "Backend:  http://localhost:8000"
          echo "Health:   http://localhost:8000/health"
          echo "DB Test:  http://localhost:8000/db-test"
          echo
          echo "Vault Agent: Running"
          echo "Database:    Running"
          echo "Backend:     Running"
          echo "Frontend:    Running"
          echo
          echo "=========================================="
